name: Build AbdullahTool EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: جلب الكود
      uses: actions/checkout@v4

    - name: تثبيت مكتبة Qt 6
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.6.2'
        arch: 'win64_msvc2019_64'

    - name: بناء المشروع عبر CMake
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build --config Release

    - name: تجميع ملفات التشغيل والخطوط العربية وملفات ADB
      shell: pwsh
      run: |
        mkdir -Force dist
        mkdir -Force dist/fonts

        # 1. نسخ ملف AbdullahTool.exe الناتج
        $exePath = Get-ChildItem -Path "build" -Recurse -Filter "AbdullahTool.exe" | Select-Object -First 1 -ExpandProperty FullName
        if ($exePath) {
            Copy-Item $exePath -Destination "dist/"
            Write-Host "Found and copied: $exePath"
        } else {
            throw "AbdullahTool.exe not found!"
        }

        # 2. تشغيل windeployqt لجلب ملفات تشغيل Qt
        $qtBin = "D:\a\AbdullahTools\Qt\6.6.2\msvc2019_64\bin\windeployqt.exe"
        if (Test-Path $qtBin) {
            & $qtBin --release --no-translations dist/AbdullahTool.exe
        }

        # 3. تحميل خطوط Google العربية الحديثة (المماثلة لخط Gemini) مباشرة إلى مجلد الأداة
        $fontUrls = @{
            "IBMPlexSansArabic-Regular.ttf"  = "https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexsansarabic/IBMPlexSansArabic-Regular.ttf"
            "IBMPlexSansArabic-Medium.ttf"   = "https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexsansarabic/IBMPlexSansArabic-Medium.ttf"
            "IBMPlexSansArabic-SemiBold.ttf" = "https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexsansarabic/IBMPlexSansArabic-SemiBold.ttf"
            "IBMPlexSansArabic-Bold.ttf"     = "https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexsansarabic/IBMPlexSansArabic-Bold.ttf"
        }
        foreach ($name in $fontUrls.Keys) {
            try {
                Invoke-WebRequest -Uri $fontUrls[$name] -OutFile "dist/fonts/$name" -UseBasicParsing
                Write-Host "Downloaded font: $name"
            } catch {
                Write-Host "Warning: Could not download $name"
            }
        }

        # 4. تحميل أدوات ADB الرسمية ودمجها
        Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile "adb.zip"
        Expand-Archive -Path "adb.zip" -DestinationPath "./dist" -Force

        # 5. تحميل محرك عرض شاشة الجوال والتحكم بها (Scrcpy) ودمجه مع الأداة تلقائياً
        Invoke-WebRequest -Uri "https://github.com/Genymobile/scrcpy/releases/download/v2.7/scrcpy-win64-v2.7.zip" -OutFile "scrcpy.zip"
        Expand-Archive -Path "scrcpy.zip" -DestinationPath "scrcpy_temp" -Force
        New-Item -ItemType Directory -Force -Path "dist/scrcpy"
        Copy-Item -Path "scrcpy_temp/scrcpy-win64-*/*" -Destination "dist/scrcpy" -Recurse -Force

    - name: رفع الأداة الجاهزة للتحميل
      uses: actions/upload-artifact@v4
      with:
        name: AbdullahTool-v2.1-GeminiUI
        path: ./dist/
